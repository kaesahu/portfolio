      text-align: center;
      min-height: 400px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

      font-size: 3rem;
      font-weight: bold;
      color: #2c3e50;
      margin-bottom: 20px;
    }
    .pronunciation {

      color: #e74c3c;
      margin-bottom: 20px;

    .meaning {
      font-size: 1.3rem;
      color: #34495e;
      margin-bottom: 20px;
      font-weight: 500;
    }
    .usage, .forms, .etymology {
      background: #f8f9fa;
      padding: 10px 15px;
      border-radius: 10px;
      margin-bottom: 15px;
      border-left: 4px solid #3498db;
    }
    .forms {
      background: #fff5f5;
      border-left: 4px solid #e74c3c;
    }
    .etymology {
      background: #f0fff4;
      border-left: 4px solid #27ae60;
    }
    .controls {
      display: flex;
      justify-content: space-between;
      padding: 20px 40px;
      background: #f8f9fa;
    }
    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: bold;
      transition: all 0.3s ease;
    }
    .btn-prev {
      background: #95a5a6;
      color: white;
    }
    .btn-prev:hover {
      background: #7f8c8d;
      transform: translateY(-2px);
    }
    .btn-next {
      background: #3498db;
      color: white;
    }
    .btn-next:hover {
      background: #2980b9;
      transform: translateY(-2px);
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .flip-btn {
      background: #e74c3c;
      color: white;
      margin: 0 auto;
      display: block;
    }
    .flip-btn:hover {
      background: #c0392b;
      transform: translateY(-2px);
    }
    @media (max-width: 768px) {
      .card-content {
        padding: 20px;
      }
      .french-word {
        font-size: 2rem;
      }
      .controls {
        flex-direction: column;
        gap: 10px;
      }
      .btn {
        width: 100%;
      }
    }
  </style>
</head>

  let currentCardIndex = 0;
  let showingDetails = false;

  const card = document.getElementById("cardContent");
  const counter = document.getElementById("counter");

  function updateCard() {
    const word = vocabulary[currentCardIndex];

    if (!showingDetails) {
      card.innerHTML = `
        <div class="french-word">${word.word}</div>
        <div class="pronunciation">(Pronunciation: ${word.pronunciation})</div>
        <div class="meaning">Meaning: ${word.meaning}</div>
      `;
    } else {
      card.innerHTML = `
        <div class="french-word">${word.word}</div>
        <div class="pronunciation">Pronunciation: ${word.pronunciation}</div>
        <div class="meaning">Meaning: ${word.meaning}</div>
        <div class="usage">
          <strong>Usage Example:</strong><br>
          ${word.usage}
        </div>
        <div class="forms">
          <strong>Other Forms & Usage:</strong><br>
          ${word.forms}
        </div>
        <div class="etymology">
          <strong>Etymology/Root:</strong><br>
          ${word.etymology}
        </div>
      `;
    }

    counter.textContent = `Card ${currentCardIndex + 1} of ${vocabulary.length}`;
  }

  function flipCard() {
    showingDetails = !showingDetails;
    updateCard();
  }

  function nextCard() {
    if (currentCardIndex < vocabulary.length - 1) {
      currentCardIndex++;
      showingDetails = false;
      updateCard();
    }
  }

  function previousCard() {
    if (currentCardIndex > 0) {
      currentCardIndex--;
      showingDetails = false;
      updateCard();
    }
  }

  // Keyboard Navigation
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') previousCard();
    else if (e.key === 'ArrowRight') nextCard();
    else if (e.key === ' ') flipCard();
  });

  updateCard(); // Initialize
</script>
